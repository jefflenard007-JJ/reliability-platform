# CI/CD: lint + test -> build and push image -> Trivy scan -> validate IaC -> bump Helm image tag (GitOps)
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/jefflenard007-jj/reliability-platform/shop-api

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: pytest -q

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint and render
        run: |
          helm lint helm/shop-api
          helm template shop-api helm/shop-api > /dev/null
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt and validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: Prometheus rules check and unit tests
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/local/prometheus:/rules" -w /rules \
            prom/prometheus:v2.55.1 check rules slo-rules.yml alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/local/prometheus:/rules" -w /rules/tests \
            prom/prometheus:v2.55.1 test rules alerts_test.yml

  build-scan-push:
    needs: [unit-tests, validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" app
      - name: Trivy vulnerability gate (HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:latest
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Push to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"

  # GitOps: commit the new image tag; Argo CD sees the change and rolls it out.
  update-gitops-tag:
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump image tag in values.yaml
        run: |
          TAG="${GITHUB_SHA::7}"
          yq -i ".image.repository = \"$IMAGE\" | .image.tag = \"$TAG\"" helm/shop-api/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: shop-api $TAG [skip ci]"
          git push
