# CI/CD: lint + test -> build image -> security scan -> validate IaC -> bump Helm image tag (GitOps)
stages: [test, build, scan, validate, deploy]

variables:
  IMAGE: $CI_REGISTRY_IMAGE/shop-api
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip

unit-tests:
  stage: test
  image: python:3.12-slim
  cache:
    paths: [.cache/pip]
  script:
    - cd app
    - pip install -r requirements-dev.txt
    - ruff check src tests
    - pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: app/report.xml

build-image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" app
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

container-scan:
  stage: scan
  image:
    name: aquasec/trivy:0.58.1
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    # Fail the pipeline on HIGH/CRITICAL vulnerabilities that have a fix available
    - trivy image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

helm-lint:
  stage: validate
  image: alpine/helm:3.16.3
  script:
    - helm lint helm/shop-api
    - helm template shop-api helm/shop-api > /dev/null

terraform-validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  script:
    - cd terraform
    - terraform fmt -check -recursive
    - terraform init -backend=false
    - terraform validate

promtool-check:
  stage: validate
  image:
    name: prom/prometheus:v2.55.1
    entrypoint: [""]
  script:
    - promtool check rules local/prometheus/slo-rules.yml local/prometheus/alerts.yml
    - promtool test rules local/prometheus/tests/alerts_test.yml

# GitOps: update the image tag in values.yaml; Argo CD sees the commit and rolls it out.
# Needs a project access token with write_repository saved as the CI/CD variable GITOPS_TOKEN.
update-gitops-tag:
  stage: deploy
  image: alpine:3.20
  script:
    - apk add --no-cache git yq
    - yq -i ".image.repository = \"$IMAGE\" | .image.tag = \"$CI_COMMIT_SHORT_SHA\"" helm/shop-api/values.yaml
    - git config user.email "ci@gitlab.com" && git config user.name "GitLab CI"
    - git commit -am "deploy: shop-api $CI_COMMIT_SHORT_SHA [skip ci]"
    - git push "https://oauth2:${GITOPS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:$CI_DEFAULT_BRANCH
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITOPS_TOKEN
