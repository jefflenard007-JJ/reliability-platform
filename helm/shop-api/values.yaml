replicaCount: 2
image:
  # Set by CI: the GitHub Container Registry path of this project
  repository: ghcr.io/jefflenard007-jj/reliability-platform/shop-api
  tag: 63aff8a
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 8000
env:
  CHAOS_ENABLED: "false"
  LOG_LEVEL: INFO
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  minAvailable: 1
# Requires the Prometheus Operator CRDs (kube-prometheus-stack)
serviceMonitor:
  enabled: true
  interval: 15s
