# Routes pages and tickets separately. To get real notifications, replace the
# webhook URL with a Slack incoming-webhook URL (keep it out of git; use a secret).
route:
  receiver: default
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="page"]
      receiver: oncall-page
    - matchers: [severity="ticket"]
      receiver: team-ticket

receivers:
  - name: default
  - name: oncall-page
    webhook_configs:
      - url: http://localhost:5001/alerts   # placeholder receiver
        send_resolved: true
  - name: team-ticket
    webhook_configs:
      - url: http://localhost:5001/tickets  # placeholder receiver
        send_resolved: true

inhibit_rules:
  # If the service is down, don't also page for its error rate
  - source_matchers: [alertname="ShopApiDown"]
    target_matchers: [service="shop-api", severity="page"]
    equal: [service]
