# SLO recording rules for shop-api
#   Availability SLO: 99.5% of requests succeed (non-5xx) over 30 days  -> error budget 0.5%
#   Latency SLO:      99% of requests complete in under 300 ms
groups:
  - name: shop-api-slo-recording
    interval: 30s
    rules:
      # Error ratio over several windows (used by multi-window burn-rate alerts)
      - record: slo:sli_error:ratio_rate5m
        expr: |
          sum(rate(http_requests_total{job="shop-api",route!~"/metrics|/healthz|/readyz",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{job="shop-api",route!~"/metrics|/healthz|/readyz"}[5m]))
      - record: slo:sli_error:ratio_rate30m
        expr: |
          sum(rate(http_requests_total{job="shop-api",route!~"/metrics|/healthz|/readyz",status=~"5.."}[30m]))
          /
          sum(rate(http_requests_total{job="shop-api",route!~"/metrics|/healthz|/readyz"}[30m]))
      - record: slo:sli_error:ratio_rate1h
        expr: |
          sum(rate(http_requests_total{job="shop-api",route!~"/metrics|/healthz|/readyz",status=~"5.."}[1h]))
          /
          sum(rate(http_requests_total{job="shop-api",route!~"/metrics|/healthz|/readyz"}[1h]))
      - record: slo:sli_error:ratio_rate6h
        expr: |
          sum(rate(http_requests_total{job="shop-api",route!~"/metrics|/healthz|/readyz",status=~"5.."}[6h]))
          /
          sum(rate(http_requests_total{job="shop-api",route!~"/metrics|/healthz|/readyz"}[6h]))

      # Latency SLI: share of requests slower than 300 ms
      - record: slo:sli_latency_slow:ratio_rate5m
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{job="shop-api",route!~"/metrics|/healthz|/readyz",le="0.3"}[5m]))
            /
            sum(rate(http_request_duration_seconds_count{job="shop-api",route!~"/metrics|/healthz|/readyz"}[5m]))
          )

      # p95 latency for dashboards
      - record: route:http_request_duration_seconds:p95_5m
        expr: |
          histogram_quantile(0.95, sum by (le, route) (rate(http_request_duration_seconds_bucket{job="shop-api"}[5m])))
